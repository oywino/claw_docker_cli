name: auto-build-wrapper
on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 */6 * * *" # every 6 hours

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Debug (list repo root)
        run: |
          pwd
          ls -la

      - name: Get latest OpenClaw release tag
        id: ver
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const r = await github.rest.repos.getLatestRelease({ owner: "openclaw", repo: "openclaw" });
            const tag = r.data.tag_name.replace(/^v/, "");
            core.setOutput("tag", tag);
            core.info(`Latest upstream tag: ${tag}`);

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: true
          build-args: |
            OPENCLAW_TAG=${{ steps.ver.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/openclaw-gateway-dockercli:${{ steps.ver.outputs.tag }}
